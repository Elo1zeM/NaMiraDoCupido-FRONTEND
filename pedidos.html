<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Pedidos | Na Mira do Cupido</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { montserrat: ['Montserrat', 'sans-serif'] },
                    colors: {
                        primary: '#e11d48',
                        secondary: '#fb7185',
                        dark: '#4c0519',
                        soft: '#fff1f2'
                    },
                    boxShadow: {
                        glow: '0 10px 40px rgba(225,29,72,.18)',
                        card: '0 20px 45px rgba(0,0,0,.06)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: radial-gradient(circle at top left, rgba(251, 113, 133, 0.15), transparent 30%),
                radial-gradient(circle at bottom right, rgba(225, 29, 72, 0.12), transparent 30%), #fff8f8;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
        }

        .gradient-text {
            background: linear-gradient(90deg, #e11d48, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card-order {
            transition: all 0.3s ease;
            border: 1px solid rgba(225, 29, 72, 0.1);
        }

        .card-order:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(225, 29, 72, 0.1);
        }

        .heart-mini {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body class="font-montserrat text-gray-800">

    <nav class="sticky top-0 left-0 w-full z-50 border-b border-rose-100/50 glass h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-6 w-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="./assets/img/dec.png" class="h-10 heart-mini"
                    onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589175.png'" />
                <div>
                    <h1 class="font-black text-lg md:text-xl gradient-text leading-none">Painel do Cupido</h1>
                    <p class="text-[9px] uppercase tracking-[0.2em] text-rose-400 font-bold">Gerenciamento de Pedidos
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3">

                <a href="/"
                    class="bg-soft hover:bg-rose-100 text-primary text-xs font-black px-6 py-3 rounded-2xl transition-all uppercase tracking-wider border border-rose-100">

                    Voltar ao Início

                </a>

                <button onclick="location.reload()"
                    class="bg-primary hover:bg-dark text-white text-xs font-black px-6 py-3 rounded-2xl transition-all shadow-glow uppercase tracking-wider">

                    Atualizar Lista

                </button>

            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6 md:p-12">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-6">
            <div>
                <span class="text-primary font-black uppercase tracking-[0.3em] text-xs">Arraiá 2026</span>
                <h2 class="text-3xl md:text-4xl font-black text-dark mt-1">Pedidos Recebidos 🏹</h2>
            </div>
            <div class="bg-white px-6 py-4 rounded-[25px] shadow-card flex items-center gap-4 border border-rose-50">
                <div class="w-12 h-12 bg-soft rounded-full flex items-center justify-center text-2xl">💘</div>
                <div>
                    <p class="text-[10px] font-bold text-rose-400 uppercase tracking-widest">Total Hoje</p>
                    <p id="contadorPedidos" class="text-2xl font-black text-primary leading-none">0 pedidos</p>
                </div>
            </div>
        </div>

        <div id="containerPedidos" class="grid gap-6">
            <div id="loadingBox"
                class="bg-white p-12 rounded-[40px] shadow-card border border-rose-50 text-center flex flex-col items-center">
                <div class="w-20 h-20 bg-soft rounded-full flex items-center justify-center mb-6 animate-bounce">
                    <span class="text-4xl">💌</span>
                </div>
                <h3 class="font-black text-dark text-xl mb-2">Buscando novos amores...</h3>
                <p class="text-gray-400 max-w-xs mx-auto text-sm leading-relaxed">
                    Aguarde um instante enquanto o Cupido organiza as flechas no banco de dados.
                </p>
            </div>
        </div>
    </main>

    <footer class="py-12 text-center text-rose-300 text-sm">
        <p>&copy; 2026 Na Mira do Cupido - Admin Mode</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Use as mesmas credenciais do seu index.html
        const SUPABASE_URL = 'https://byslhgoryfhwhkxhklrj.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_pP8N05O2b0vdXEJBx4W5AA__Q66I83B';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function carregarPedidos() {
            const container = document.getElementById('containerPedidos');

            // Aqui você deve colocar o nome da sua tabela de PEDIDOS (ex: 'pedidos1')
            // Se ainda não criou a tabela de pedidos, mude para 'produtos1' apenas para testar o layout
            const { data, error } = await _supabase
                .from('pedidos1') // Mude para o nome da sua tabela de pedidos real
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `
                    <div class="bg-red-50 p-8 rounded-[30px] border border-red-100 text-center">
                        <p class="text-red-500 font-bold">Erro ao carregar banco de dados.</p>
                        <p class="text-red-400 text-xs mt-2">${error.message}</p>
                    </div>
                `;
                return;
            }

            renderizarPedidos(data);
        }

        function renderizarPedidos(pedidos) {
            const container = document.getElementById('containerPedidos');
            const contador = document.getElementById('contadorPedidos');

            if (pedidos.length === 0) {
                container.innerHTML = `<p class="text-center py-10 text-rose-300 font-medium">Nenhum pedido encontrado por enquanto... 💔</p>`;
                contador.innerText = "0 pedidos";
                return;
            }

            contador.innerText = `${pedidos.length} ${pedidos.length === 1 ? 'pedido' : 'pedidos'}`;

            container.innerHTML = pedidos.map(pedido => `
                <div class="bg-white p-6 md:p-8 rounded-[35px] shadow-card card-order flex flex-col gap-6">

    <div class="flex items-center justify-between gap-6 flex-wrap">

        <div class="flex items-center gap-5">

            <div class="w-14 h-14 bg-soft rounded-2xl flex items-center justify-center text-2xl shadow-sm">
                💘
            </div>

            <div>

                <h3 class="font-black text-dark text-lg">
                    ${pedido.cliente_nome || 'Cliente'}
                </h3>

                <p class="text-rose-400 text-sm font-semibold italic">
                    Total: R$ ${pedido.total.toFixed(2)}
                </p>

            </div>

        </div>

        <span class="bg-soft text-primary px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider">
            ${pedido.status || 'pendente'}
        </span>

    </div>

    <div class="bg-rose-50/40 rounded-2xl p-5 border border-rose-100">

        <p class="text-xs uppercase tracking-[0.2em] text-rose-400 font-black mb-4">
            Produtos do Pedido
        </p>

        <div class="space-y-3">

            ${pedido.itens.map(item => `

                <div class="flex justify-between items-center bg-white p-4 rounded-2xl">

                    <div>

                        <h4 class="font-bold text-dark">
                            ${item.quantidade}x ${item.nome}
                        </h4>

                        <p class="text-rose-400 text-sm">
                            R$ ${item.preco.toFixed(2)} cada
                        </p>

                    </div>

                    <p class="font-black text-primary">
                        R$ ${item.subtotal.toFixed(2)}
                    </p>

                </div>

            `).join('')}

        </div>

    </div>

</div>
            `).join('');
        }

        // Iniciar
        carregarPedidos();

        // Atualizar automaticamente a cada 30 segundos
        setInterval(carregarPedidos, 30000);
    </script>
</body>

</html>
