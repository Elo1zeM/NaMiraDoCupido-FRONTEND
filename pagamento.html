<!-- pagamento.html -->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento | Na Mira do Cupido</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { montserrat: ['Montserrat', 'sans-serif'] },
                    colors: {
                        primary: '#e11d48',
                        secondary: '#fb7185',
                        dark: '#4c0519',
                        soft: '#fff1f2'
                    },
                    boxShadow: {
                        glow: '0 10px 40px rgba(225,29,72,.18)',
                        card: '0 20px 45px rgba(0,0,0,.06)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background:
                radial-gradient(circle at top left, rgba(251, 113, 133, 0.15), transparent 30%),
                radial-gradient(circle at bottom right, rgba(225, 29, 72, 0.12), transparent 30%),
                #fff8f8;
            min-height: 100vh;
        }

        .glass {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
        }

        .gradient-text {
            background: linear-gradient(90deg, #e11d48, #fb7185);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .heart-mini {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body class="font-montserrat text-gray-800">

    <nav class="sticky top-0 left-0 w-full z-50 border-b border-rose-100/50 glass h-20 flex items-center">
        <div class="max-w-7xl mx-auto px-6 w-full flex items-center justify-between">

            <div class="flex items-center gap-3">
                <img src="./assets/img/dec.png" class="h-10 heart-mini"
                    onerror="this.src='https://cdn-icons-png.flaticon.com/512/2589/2589175.png'" />

                <div>
                    <h1 class="font-black text-lg md:text-xl gradient-text leading-none">
                        Na Mira do Cupido
                    </h1>

                    <p class="text-[9px] uppercase tracking-[0.2em] text-rose-400 font-bold">
                        Página de Pagamento
                    </p>
                </div>
            </div>

            <a href="index.html"
                class="bg-primary hover:bg-dark text-white text-xs font-black px-6 py-3 rounded-2xl transition-all shadow-glow uppercase tracking-wider">
                Voltar
            </a>

        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-6 py-10 md:py-16">

        <div class="text-center mb-10">

            <span class="text-primary font-black uppercase tracking-[0.3em] text-xs">
                Arraiá 2026
            </span>

            <h2 class="text-4xl md:text-5xl font-black text-dark mt-2">
                Finalizar Pedido 💌
            </h2>

            <p class="text-gray-500 mt-4 max-w-xl mx-auto leading-relaxed">
                Confira os itens do seu pedido e finalize a compra.
            </p>

        </div>

        <div class="bg-white rounded-[40px] shadow-card border border-rose-100 p-8 md:p-10">

            <form id="checkout-form" class="space-y-6">

                <div>
                    <label class="block text-sm font-black uppercase tracking-wider text-rose-400 mb-3">
                        Nome do Cliente
                    </label>

                    <input id="cliente" name="cliente" type="text" placeholder="Digite seu nome" required
                        class="w-full bg-soft border border-rose-100 rounded-2xl px-5 py-4 outline-none focus:ring-4 focus:ring-rose-200 transition-all font-medium">
                </div>

                <div>
                    <label class="block text-sm font-black uppercase tracking-wider text-rose-400 mb-3">
                        Mensagem para o Pedido
                    </label>

                    <textarea id="mensagem_carta" name="mensagem_carta" rows="5"
                        placeholder="Escreva uma mensagem especial..."
                        class="w-full bg-soft border border-rose-100 rounded-2xl px-5 py-4 outline-none focus:ring-4 focus:ring-rose-200 transition-all font-medium resize-none"></textarea>
                </div>

                <!-- RESUMO -->
                <div id="resumoPedido" class="bg-soft rounded-[30px] p-6 border border-rose-100 space-y-4">
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-dark text-white py-5 rounded-2xl font-black uppercase tracking-[0.2em] text-sm transition-all shadow-glow">
                    Confirmar Pagamento 💘
                </button>

                <p class="text-center text-sm text-rose-300 font-medium">
                    Após o pagamento você será levado para a página de confirmação.
                </p>

                <p id="error" hidden
                    class="bg-red-50 border border-red-100 text-red-500 text-sm font-semibold rounded-2xl p-4 text-center">
                </p>

            </form>

        </div>

    </main>

    <footer class="py-10 text-center text-rose-300 text-sm">
        <p>&copy; 2026 Na Mira do Cupido</p>
    </footer>

    <script>

        const pedidoSalvo =
            JSON.parse(localStorage.getItem('pedidoAtual'));

        if (!pedidoSalvo || !pedidoSalvo.itens.length) {

            alert('Seu carrinho está vazio.');

            window.location.href = 'index.html';
        }

        const resumo = document.getElementById('resumoPedido');

        resumo.innerHTML = pedidoSalvo.itens.map(item => `
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl">

                <div>
                    <h3 class="font-black text-dark">
                        ${item.quantidade}x ${item.nome}
                    </h3>

                    <p class="text-rose-400 text-sm">
                        R$ ${item.preco.toFixed(2)} cada
                    </p>
                </div>

                <p class="font-black text-primary text-lg">
                    R$ ${item.subtotal.toFixed(2)}
                </p>

            </div>
        `).join('') + `

        <div class="flex justify-between items-center pt-4 border-t border-rose-100">

            <span class="font-black text-dark text-xl">
                Total
            </span>

            <span class="font-black text-primary text-3xl">
                R$ ${pedidoSalvo.total.toFixed(2)}
            </span>

        </div>
        `;

        const form = document.getElementById('checkout-form');
        const errorEl = document.getElementById('error');

        form.addEventListener('submit', async event => {

            event.preventDefault();

            errorEl.hidden = true;

            const pedido = {

                cliente_nome: form.cliente.value.trim(),

                mensagem_carta:
                    form.mensagem_carta.value.trim(),

                itens: pedidoSalvo.itens,

                total: pedidoSalvo.total
            };

           try {

    localStorage.setItem(
        'pedidoAtual',
        JSON.stringify(pedido)
    );

   

    window.location.href = 'pagamento-final.html';

} catch (error) {

    errorEl.textContent = 'Erro ao finalizar pedido.';

    errorEl.hidden = false;
}
            
        });

    </script>

</body>

</html>
